<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e18">
<title>Vex Tarot</title>
<link rel="stylesheet" href="retro.css">
</head>
<body>
<main id="stage" data-state="idle" data-phase="idle">
  <div class="frame" id="frame">
    <canvas id="scene" width="320" height="212" aria-hidden="true"></canvas>
    <nav class="controls" aria-label="Reading controls">
      <button id="talk" type="button" data-control="talk">Talk to Vex</button>
      <input id="type" type="text" maxlength="500" autocomplete="off" spellcheck="false" enterkeyhint="send" aria-label="Type to Vex" disabled>
      <button id="leave" type="button" data-control="leave" hidden>Leave</button>
    </nav>
    <section class="notice" id="notice" hidden>
      <p class="eyebrow" id="chapter">A private audience</p>
      <h1 id="headline">Your future. My condolences.</h1>
      <p id="intro">Sit close. Tell me what’s on your mind. I’ll consult the cards. And judge you a little.</p>
    </section>
  </div>
  <!-- Screen-reader copy of what the canvas shows. -->
  <div class="sr-only">
    <p id="status" role="status"><span id="status-text">Ready when you are.</span></p>
    <p id="subs" aria-live="off"></p>
    <div id="reading-focus" hidden><p id="hero-position"></p><p id="hero-name"></p><p id="hero-orientation"></p><p id="question"></p></div>
    <div class="table" id="table" aria-label="Your cards"></div>
    <section id="afterword" hidden><p>The verdict</p><p id="verdict"></p></section>
  </div>
  <pre class="debug" id="debug" hidden></pre>
</main>
<script type="module" src="live.js"></script>
</body>
</html>
